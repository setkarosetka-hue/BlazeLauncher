
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — BlazeLauncher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #090909;
            color: #fff;
            font-family: 'Onest', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            color: #ff7518;
            filter: drop-shadow(0 0 25px rgba(255,117,24,0.25));
        }

        .error-code {
            font-size: clamp(90px, 20vw, 160px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -8px;
            background: linear-gradient(135deg, #ff7518, #ffb52e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: 30px;
            margin: 25px 0 15px;
        }

        p {
            color: #999;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 25px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff7518, #ffb52e);
            color: #111;
            text-decoration: none;
            font-weight: 800;
            transition: 0.25s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255,117,24,0.25);
        }

        .button svg {
            width: 20px;
            height: 20px;
        }

        .logo {
            margin-top: 60px;
            font-size: 14px;
            color: #666;
        }

        .logo span {
            color: #ff7518;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div class="container">

        <svg class="icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c2 4-2 5-1 8 1 2 3 1 3 4a4 4 0 0 1-8 0c0-4 3-6 3-9 2 1 3 3 3 3"/>
            <path d="M14 12c2 1 4 3 4 5a6 6 0 0 1-12 0"/>
        </svg>

        <div class="error-code">404</div>

        <h1>Кажется, ты заблудился</h1>

        <p>
            Такой страницы не существует или она была перемещена.
            Но не переживай — вернёмся на главную BlazeLauncher.
        </p>

        <a href="./" class="button">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 10 9-7 9 7"/>
                <path d="M5 9v12h14V9"/>
                <path d="M9 21v-8h6v8"/>
            </svg>

            На главную
        </a>

        <div class="logo">
            <span>BlazeLauncher</span> — Minecraft Java Launcher
        </div>

    </div>

</body>
</html>
