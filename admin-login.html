
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>Вход администратора — BlazeLauncher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top, #28170c, #090909 65%);
            color: white;
            font-family: 'Onest', sans-serif;
        }

        .login {
            width: 100%;
            max-width: 410px;
            padding: 35px;
            background: rgba(25, 25, 25, .95);
            border: 1px solid #333;
            border-radius: 22px;
            box-shadow: 0 20px 70px #0008;
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
            color: #ff7518;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 9px;
        }

        .description {
            color: #999;
            font-size: 14px;
            margin-bottom: 27px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-size: 13px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #101010;
            border: 1px solid #393939;
            border-radius: 11px;
            color: white;
            outline: none;
            font: inherit;
        }

        input:focus {
            border-color: #ff7518;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 24px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #ff7518, #ffb52e);
            color: #111;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        #message {
            min-height: 22px;
            margin-top: 17px;
            font-size: 13px;
            color: #ff7777;
            line-height: 1.5;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #ffb52e;
        }

        .security {
            margin-top: 24px;
            padding-top: 17px;
            border-top: 1px solid #333;
            color: #777;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login">
        <div class="logo">B.</div>

        <h1>Вход администратора</h1>

        <p class="description">
            Авторизация в панели управления BlazeLauncher.
            Доступ разрешён только администраторам.
        </p>

        <form id="loginForm">
            <label for="email">Электронная почта</label>
            <input
                id="email"
                type="email"
                placeholder="admin@example.com"
                autocomplete="username"
                required
            >

            <label for="password">Пароль</label>
            <input
                id="password"
                type="password"
                placeholder="Введите пароль"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                Войти в панель
            </button>
        </form>

        <div id="message" role="status"></div>

        <a class="back" href="./index.html">
            ← Вернуться на сайт
        </a>

        <div class="security">
            Защищённая авторизация · Supabase
        </div>
    </main>

    <script type="module" src="./admin-login.js"></script>
</body>
</html>
